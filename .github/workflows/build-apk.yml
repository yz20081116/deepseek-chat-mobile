name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Locate Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME = $ANDROID_HOME"
          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(none)"
          echo "--- installed build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(none)"
          echo "--- cmdline-tools ---"
          ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || echo "(none)"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages (best effort)
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Restore stable debug keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Create debug keystore (first run only)
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets into the app
        run: npx cap sync android

      - name: Generate launcher icons
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          if command -v magick > /dev/null; then IM=magick; else IM=convert; fi
          "$IM" -background none assets/icon.ico -resize 1024x1024 -gravity center -extent 1024x1024 assets/icon.png || true
          if [ -f assets/icon.png ]; then
            npx --yes @capacitor/assets generate --android || true
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
